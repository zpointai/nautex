<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"><title>Nautex recovery password</title><style>body{margin:32px;background:#101827;color:#edf2f7;font:16px/1.5 system-ui}h1{font-size:24px}label{display:block;margin-top:16px}input{box-sizing:border-box;width:100%;padding:10px;font:inherit;color:inherit;background:#182437;border:1px solid #698399;border-radius:6px}button{font:inherit;padding:10px 18px;margin:18px 12px 0 0;border:0;border-radius:6px;cursor:pointer}button[type=submit]{background:#36d5bb;color:#081a20}#error{color:#ffb6aa}</style></head><body><h1 id="heading">Protect your recovery copy</h1><p id="explanation">Use a unique recovery password of at least 16 characters. Store it separately: Nautex cannot recover a forgotten password.</p><form id="form"><label>Recovery password<input id="password" type="password" minlength="16" maxlength="256" required autocomplete="new-password" autofocus></label><label id="repeat-label">Confirm recovery password<input id="repeat" type="password" maxlength="256" autocomplete="new-password"></label><p id="error" role="alert"></p><button type="submit">Continue</button><button type="button" id="cancel">Cancel</button></form><script src="recovery-password.js"></script></body></html>
